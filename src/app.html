<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
		<link
			rel="preload"
			href="/fonts/atkinson-hyperlegible-next-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Apply the saved theme before first paint (see ThemeToggle.svelte).
			try {
				const theme = localStorage.getItem('adg:theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
